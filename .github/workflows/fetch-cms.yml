name: fetch-cms
on:
  push:
    branches: [cms-data]
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: cms-data }
      - run: python3 scripts/fetch_cms.py
      - name: split big files
        run: |
          cd data
          for f in *.gz; do s=$(stat -c%s "$f"); if [ $s -gt 90000000 ]; then split -b 90m -d "$f" "$f.part"; rm "$f"; fi; done
          ls -la
      - name: commit
        run: |
          git config user.name "cms-bot"; git config user.email "cms-bot@users.noreply.github.com"
          git add data
          git commit -m "CMS data $(date -u +%F)" || echo nothing
          git push origin cms-data
